# HLS 배포용. 클러스터 안에서만 쓰고 밖에는 ALB 가 /hls 로 내보낸다.
apiVersion: v1
kind: Service
metadata:
  name: mediamtx
  namespace: o2-dev
  labels:
    app.kubernetes.io/name: mediamtx
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mediamtx
  ports:
    - name: http
      port: 80
      targetPort: hls
