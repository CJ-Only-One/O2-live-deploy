apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: o2-dev
  labels:
    app.kubernetes.io/name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      containers:
        - name: frontend
          # app.yml의 deploy 잡이 yq로 이 줄만 갈아끼운다.
          # 처음 값은 공개 이미지다 — 매니페스트가 먼저 머지되고 첫 태그 갱신이
          # 오기 전까지 ImagePullBackOff로 남지 않게 하기 위해서다(testpage와 동일).
          image: 066107819912.dkr.ecr.ap-northeast-2.amazonaws.com/o2/frontend:66ebfa4701d4866dd9154ee58abc4138bb1f1322
          ports:
            - name: http
              containerPort: 8080
          # 정적 페이지라 뜨는 데 시간이 걸리지 않는다. startupProbe는 필요 없다.
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # Dockerfile의 USER와 같은 값이어야 한다. 이름으로만 지정하면
            # kubelet이 root 여부를 검증하지 못해 CreateContainerConfigError로 죽는다.
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # readOnlyRootFilesystem을 켰으니 nginx가 쓸 곳은 따로 준다.
            # unprivileged 이미지는 pid 파일과 임시 파일을 /tmp 에 쓴다.
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
