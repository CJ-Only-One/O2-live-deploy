apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: o2-dev
  labels:
    app.kubernetes.io/name: frontend
spec:
  # 시청자가 방송에 들어오는 입구다. 하나면 그 노드가 죽는 동안 방송이 살아
  # 있어도 아무도 못 들어온다. 정적 페이지라 상태가 없어 늘리는 데 제약이 없다.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: o2
    spec:
      # 노드그룹이 교체되면 파드가 한꺼번에 Pending 이 됐다가 배치된다. 그때 먼저
      # Ready 된 노드로 전부 쏠리고, 쿠버네티스는 나중에 뜬 노드로 **재분배하지
      # 않는다.** 2026-08-21 에 그 쏠림으로 노드 하나가 메모리 94% 가 되어
      # Datadog DaemonSet 이 Pending 으로 남았다 (measurements.md M-010).
      #
      # `app.kubernetes.io/name` 이 아니라 `part-of` 로 묶는 이유는, 서비스마다
      # 따로 흩으면 replicas 1 짜리 넷이 같은 노드에 몰려도 각자 제약을 만족해
      # 아무것도 막지 못하기 때문이다. o2-dev 파드 전체를 한 덩어리로 본다.
      #
      # DoNotSchedule 이어도 노드가 하나만 남으면 도메인이 하나라 skew 가 0 이라
      # 스케줄을 막지 않는다. 이미 떠 있는 파드를 옮기지는 않으므로, 노드를
      # 추가한 뒤에는 `kubectl rollout restart deploy -n o2-dev` 가 필요하다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/part-of: o2
        # replicas 2 를 둔 이유가 노드 장애를 견디는 것이므로 AZ 로 가른다.
        # topologyKey 가 위와 달라야 한다 — 같은 키면 배열 merge 로 두 항목이
        # 하나가 되면서 DoNotSchedule 이 사라진다.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
          # 롤링 중에는 구 ReplicaSet 파드까지 세어 제약이 무력해진다.
          # DoNotSchedule 은 스케줄되는 순간에만 판정하는데, 구 파드가 아직
          # 남아 있는 상태에서는 새 파드를 어느 AZ 에 놓아도 skew 가 1 이라
          # 둘 다 통과한다. 그렇게 새 파드 둘이 같은 AZ 로 간 뒤 구 파드가
          # 빠지면 결과만 쏠린다 — 각 단계는 제약을 지켰는데 최종 상태가
          # 어긋난다. 2026-08-25 에 api 두 파드가 그렇게 2a 로 몰렸다.
          #
          # pod-template-hash 를 세는 기준에 넣으면 같은 ReplicaSet 파드끼리만
          # 비교하므로 새 파드 둘이 서로를 보고 갈라진다.
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: frontend
          # app.yml의 deploy 잡이 yq로 이 줄만 갈아끼운다.
          # 처음 값은 공개 이미지다 — 매니페스트가 먼저 머지되고 첫 태그 갱신이
          # 오기 전까지 ImagePullBackOff로 남지 않게 하기 위해서다(testpage와 동일).
          image: 066107819912.dkr.ecr.ap-northeast-2.amazonaws.com/o2/frontend:af6c7a213ff1ae092ff12e8b1bf18c67d86460c0
          ports:
            - name: http
              containerPort: 8080
          # 정적 페이지라 뜨는 데 시간이 걸리지 않는다. startupProbe는 필요 없다.
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # Dockerfile의 USER와 같은 값이어야 한다. 이름으로만 지정하면
            # kubelet이 root 여부를 검증하지 못해 CreateContainerConfigError로 죽는다.
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # readOnlyRootFilesystem을 켰으니 nginx가 쓸 곳은 따로 준다.
            # unprivileged 이미지는 pid 파일과 임시 파일을 /tmp 에 쓴다.
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
