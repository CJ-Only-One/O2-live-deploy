apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: o2-dev
  labels:
    app.kubernetes.io/name: api
spec:
  replicas: 1
  # 새 파드를 먼저 띄우지 않는다. 기본값(maxSurge 25% → 1)이면 롤링 중
  # 잠시 두 파드가 공존하는데, 384Mi 를 요청하는 파드가 들어갈 자리가
  # 노드에 없다. t3.small 3대가 이미 73~81% 차 있어 새 파드가 Pending 으로
  # 멈추고 롤아웃이 영영 끝나지 않는다 — Karpenter 가 없으므로 (D-037)
  # 노드가 저절로 늘지도 않는다.
  #
  # 대가는 교체 중 수 초의 공백이다. replicas 가 1 이라 어차피 무중단이
  # 아니었다. 노드가 늘거나 replicas 가 2 이상이 되면 이 블록을 지운다.
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: o2
        # 이미지 태그와 같은 커밋 SHA. app.yml의 deploy 잡이 이미지와 함께 갱신한다.
        #
        # Pod 템플릿에만 둔다. selector.matchLabels는 생성 후 불변이라
        # 거기 넣으면 다음 배포부터 apply가 거부된다. Service 셀렉터에 넣어도
        # 안 된다 — 롤링 중 한쪽 파드 집합이 통째로 엔드포인트에서 빠진다.
        #
        # 값을 env에 직접 적지 않고 라벨을 두는 이유는 쓰기 지점을 하나로
        # 묶기 위해서다. 아래 두 환경변수가 이것을 참조하므로 O2 이벤트의
        # 버전과 Datadog의 버전이 서로 어긋날 수 없다.
        app.kubernetes.io/version: edd1de0acab35fe0941df8d2c5e8cf5bd8980cf2
    spec:
      # 노드그룹이 교체되면 파드가 한꺼번에 Pending 이 됐다가 배치된다. 그때 먼저
      # Ready 된 노드로 전부 쏠리고, 쿠버네티스는 나중에 뜬 노드로 **재분배하지
      # 않는다.** 2026-08-21 에 그 쏠림으로 노드 하나가 메모리 94% 가 되어
      # Datadog DaemonSet 이 Pending 으로 남았다 (measurements.md M-010).
      #
      # `app.kubernetes.io/name` 이 아니라 `part-of` 로 묶는 이유는, 서비스마다
      # 따로 흩으면 replicas 1 짜리 넷이 같은 노드에 몰려도 각자 제약을 만족해
      # 아무것도 막지 못하기 때문이다. o2-dev 파드 전체를 한 덩어리로 본다.
      #
      # DoNotSchedule 이어도 노드가 하나만 남으면 도메인이 하나라 skew 가 0 이라
      # 스케줄을 막지 않는다. 이미 떠 있는 파드를 옮기지는 않으므로, 노드를
      # 추가한 뒤에는 `kubectl rollout restart deploy -n o2-dev` 가 필요하다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/part-of: o2
      # AWS 자격증명은 이 ServiceAccount에 걸린 EKS Pod Identity로 들어온다.
      # 액세스 키를 이미지나 Secret에 넣지 않는다.
      # 연결은 infra/04-platform 의 app_data_access.tf 가 만든다 —
      # 여기 이름과 그쪽 app_service_accounts 목록이 어긋나면 파드는 정상적으로
      # 뜨고 SQS 호출에서만 실패한다. 기동이 성공하므로 알아채기 늦다.
      serviceAccountName: api
      # 종료 신호를 받고 실제로 죽기까지 주는 시간.
      # uvicorn은 SIGTERM을 받으면 새 요청을 안 받고 처리 중인 것만 끝낸다.
      # 그 시간보다 넉넉해야 처리 중 요청이 안 잘린다.
      terminationGracePeriodSeconds: 40
      containers:
        - name: api
          # app.yml의 deploy 잡이 yq로 이 줄만 갈아끼운다.
          # 태그는 커밋 SHA다. latest를 쓰면 롤백이 불가능해진다.
          image: 066107819912.dkr.ecr.ap-northeast-2.amazonaws.com/o2/api:edd1de0acab35fe0941df8d2c5e8cf5bd8980cf2
          ports:
            - name: http
              containerPort: 8000
          # 접속 정보는 여기에 적지 않는다. RDS/Valkey 엔드포인트는 데이터 스택을
          # 다시 만들면 바뀌는데, 매니페스트에 박아두면 그때 조용히 어긋난다.
          #
          # o2-data (ConfigMap)  — infra/04-platform 이 03-data 의 remote state에서
          #                        읽어 만든다. DB/Valkey/SQS 주소가 들어 있다.
          # o2-db   (Secret)     — RDS가 만들어 Secrets Manager에 넣은 마스터
          #                        비밀번호를 ESO가 동기화한다. DB_PASSWORD 하나뿐.
          #
          # o2-events (Secret) — 이벤트 SDK가 user_key를 HMAC으로 바꿀 때 쓰는
          #                       salt. 세 서비스가 같은 값을 봐야 같은 사용자로
          #                       조인된다. infra/04-platform 의 app_events.tf.
          #
          # 셋 다 없는 상태로 배포하면 파드는 뜨지만 config.py의 기본값
          # (localhost:3306)을 보고 DB 연결에서만 실패한다.
          envFrom:
            - configMapRef:
                name: o2-data
            - secretRef:
                name: o2-db
            - secretRef:
                name: o2-events
          # 이벤트 SDK와 Datadog이 읽는 값. 위 ConfigMap과 달리 서비스마다
          # 달라지는 상수라 여기 직접 적는다.
          #
          # 버전은 Pod 템플릿의 라벨에서 가져온다. 두 곳에 SHA를 복사하면
          # 한쪽만 갱신된 상태가 생길 수 있고, 그러면 이벤트는 v1이라 하고
          # Datadog은 v2라 하는 상태가 되어 배포 장애 감별이 무너진다.
          env:
            - name: O2_SERVICE
              value: api
            - name: DD_SERVICE
              value: api
            - name: DD_ENV
              value: dev
            - name: O2_SERVICE_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            - name: DD_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            # 트레이스를 보낼 곳. Datadog 에이전트는 DaemonSet이라 파드와 같은
            # 노드에 있고, hostPort 8126으로 받는다. 서비스 이름으로 부르면
            # 다른 노드의 에이전트에 갈 수 있어 트레이스와 노드 지표가 어긋난다.
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          # FastAPI/uvicorn은 JVM과 달리 뜨는 데 시간이 안 걸린다.
          # startupProbe 없이도 liveness가 먼저 실패할 일이 없다.
          #
          # readiness와 liveness가 보는 것이 다르다.
          #   readyz  MySQL·Valkey 연결까지 — 의존성이 끊기면 트래픽을 받지 않는다
          #   health  프로세스 생존만 — 여기서 의존성을 보면 DB 순단에
          #           전 파드가 재시작 루프에 빠진다
          readinessProbe:
            httpGet: {path: /api/readyz, port: http}
            periodSeconds: 10
            # 기본값 1초로는 부족하다. readyz의 MySQL·Valkey 연결 타임아웃이
            # 각각 2초라, 의존성이 느려지면 응답이 오기 전에 프로브가 먼저
            # 끊어 파드가 NotReady로 빠진다.
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 640Mi # CPU limit은 일부러 걸지 않는다 — 스로틀링이 지연을 만든다
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # Dockerfile의 USER와 같은 값이어야 한다.
            # 비워두고 이미지에서 이름으로만 USER를 지정하면 kubelet이
            # root 여부를 검증하지 못해 CreateContainerConfigError 로 죽는다.
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # readOnlyRootFilesystem을 켰으니 쓸 수 있는 임시 공간을 따로 준다.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
