apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: o2-dev
  annotations:
    # 이 리소스만 Server-Side Apply 로 동기화한다.
    #
    # 이전 매니페스트가 topologySpreadConstraints 두 항목에 같은 topologyKey
    # (kubernetes.io/hostname) 를 썼다. 그 배열의 merge key 가 topologyKey 라서
    # last-applied-configuration 안에 키가 중복된 리스트가 남아 있고, 기본
    # 방식(client-side 3-way merge)으로 적용하면 그 중복 때문에 병합 결과가
    # maxSkew: 0 · matchLabels: null 로 깨진다. 검증에서 걸려 apply 자체가
    # 실패하므로, 고친 매니페스트를 넣어도 영원히 반영되지 않는다.
    #
    # SSA 는 필드 소유권으로 병합해 이 이력을 타지 않는다. 한 번 넘어가고 나면
    # 애노테이션이 새 구조로 갈리므로 뒤에는 없어도 되지만, 같은 실수를 다시
    # 막아주므로 남겨 둔다.
    argocd.argoproj.io/sync-options: ServerSideApply=true
  annotations:
    # Service selector를 전용 멤버십 라벨로 옮길 때 Deployment가 먼저 Healthy가
    # 되어야 한다. Service가 먼저 바뀌면 새 라벨을 가진 Endpoint가 0개인 짧은
    # 단절이 생긴다. canary도 같은 멤버십 라벨만 공유하고 Deployment selector는
    # 별도로 가져 컨트롤러끼리 Pod를 뺏지 않는다.
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: api
spec:
  # 파드가 하나면 "정상 파드 여럿 중 하나만 느리다" 를 만들 수 없다. 정상 파드
  # 중앙값도, 한 단계 증설도, 파드별 지연 이상치 탐지도 비교 대상이 없어
  # 성립하지 않는다 (measurements.md M-016).
  #
  # 아래 topologySpreadConstraints 의 DoNotSchedule 이 두 파드를 서로 다른
  # 노드로 가른다. 같은 노드에 몰리면 2 vCPU 를 나눠 써 파드당 계수가 오염된다.
  replicas: 2
  # maxSurge 0 을 걸어뒀던 블록을 지운다. 그 블록은 t3.small 3대가 73~81%
  # 차 있고 Karpenter 가 없던 시점(D-037)의 제약이었고, 주석 자신이 "노드가
  # 늘거나 replicas 가 2 이상이 되면 이 블록을 지운다" 고 적어뒀다.
  # 지금은 c6i.large 2대에 Karpenter 가 있다 (D-051).
  #
  # 기본값(maxSurge 25% → 1)으로 돌아가므로 롤링 중 파드 하나분(100m·384Mi)
  # 여유가 필요하다. 2026-08-24 기준 노드 여유는 730m·550m 이라 들어간다.
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: o2
        # Service가 main과 S2 canary를 함께 고르는 전용 라벨. Deployment의
        # selector에는 넣지 않는다 — canary는 자기 selector를 따로 써야 한다.
        o2.cj.io/api-service-member: "true"
        # 이미지 태그와 같은 커밋 SHA. app.yml의 deploy 잡이 이미지와 함께 갱신한다.
        #
        # Pod 템플릿에만 둔다. selector.matchLabels는 생성 후 불변이라
        # 거기 넣으면 다음 배포부터 apply가 거부된다. Service 셀렉터에 넣어도
        # 안 된다 — 롤링 중 한쪽 파드 집합이 통째로 엔드포인트에서 빠진다.
        #
        # 값을 env에 직접 적지 않고 라벨을 두는 이유는 쓰기 지점을 하나로
        # 묶기 위해서다. 아래 두 환경변수가 이것을 참조하므로 O2 이벤트의
        # 버전과 Datadog의 버전이 서로 어긋날 수 없다.
        app.kubernetes.io/version: 4eb35cda9ef3ab87349257c030f4e3b25916712d
    spec:
      # 노드그룹이 교체되면 파드가 한꺼번에 Pending 이 됐다가 배치된다. 그때 먼저
      # Ready 된 노드로 전부 쏠리고, 쿠버네티스는 나중에 뜬 노드로 **재분배하지
      # 않는다.** 2026-08-21 에 그 쏠림으로 노드 하나가 메모리 94% 가 되어
      # Datadog DaemonSet 이 Pending 으로 남았다 (measurements.md M-010).
      #
      # `app.kubernetes.io/name` 이 아니라 `part-of` 로 묶는 이유는, 서비스마다
      # 따로 흩으면 replicas 1 짜리 넷이 같은 노드에 몰려도 각자 제약을 만족해
      # 아무것도 막지 못하기 때문이다. o2-dev 파드 전체를 한 덩어리로 본다.
      #
      # DoNotSchedule 이어도 노드가 하나만 남으면 도메인이 하나라 skew 가 0 이라
      # 스케줄을 막지 않는다. 이미 떠 있는 파드를 옮기지는 않으므로, 노드를
      # 추가한 뒤에는 `kubectl rollout restart deploy -n o2-dev` 가 필요하다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/part-of: o2
        # ── AZ 분리 (강제) ──────────────────────────────────
        # replicas 2 를 두는 이유가 노드 하나를 잃어도 버티는 것이므로 반드시
        # 갈라야 한다. **topologyKey 가 위와 달라야 한다** — 배열의 merge key 가
        # topologyKey 라서, 같은 키로 두 항목을 적으면 서버가 하나로 합치면서
        # 뒤엣것의 DoNotSchedule 이 사라진다. 매니페스트에는 두 개가 보이는데
        # 클러스터에는 ScheduleAnyway 하나만 남고, Argo 는 그 상태를 Synced 로
        # 보고해 드리프트로도 안 잡힌다. 2026-08-25 에 api 두 파드가 같은 노드에
        # 몰려 있는 것으로 발견했다.
        #
        # 노드가 아니라 AZ 로 가르는 이유는 노드그룹 max 가 6 이라 한 AZ 에
        # 노드가 둘 이상 생길 수 있고, 그때 hostname 기준이면 같은 AZ 안에서만
        # 갈리기 때문이다.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
      # AWS 자격증명은 이 ServiceAccount에 걸린 EKS Pod Identity로 들어온다.
      # 액세스 키를 이미지나 Secret에 넣지 않는다.
      # 연결은 infra/04-platform 의 app_data_access.tf 가 만든다 —
      # 여기 이름과 그쪽 app_service_accounts 목록이 어긋나면 파드는 정상적으로
      # 뜨고 SQS 호출에서만 실패한다. 기동이 성공하므로 알아채기 늦다.
      serviceAccountName: api
      # 종료 신호를 받고 실제로 죽기까지 주는 시간.
      # uvicorn은 SIGTERM을 받으면 새 요청을 안 받고 처리 중인 것만 끝낸다.
      # 그 시간보다 넉넉해야 처리 중 요청이 안 잘린다.
      terminationGracePeriodSeconds: 40
      containers:
        - name: api
          # app.yml의 deploy 잡이 yq로 이 줄만 갈아끼운다.
          # 태그는 커밋 SHA다. latest를 쓰면 롤백이 불가능해진다.
          image: 066107819912.dkr.ecr.ap-northeast-2.amazonaws.com/o2/api:4eb35cda9ef3ab87349257c030f4e3b25916712d
          ports:
            - name: http
              containerPort: 8000
          # 접속 정보는 여기에 적지 않는다. RDS/Valkey 엔드포인트는 데이터 스택을
          # 다시 만들면 바뀌는데, 매니페스트에 박아두면 그때 조용히 어긋난다.
          #
          # o2-data (ConfigMap)  — infra/04-platform 이 03-data 의 remote state에서
          #                        읽어 만든다. DB/Valkey/SQS 주소가 들어 있다.
          # o2-db   (Secret)     — RDS가 만들어 Secrets Manager에 넣은 마스터
          #                        비밀번호를 ESO가 동기화한다. DB_PASSWORD 하나뿐.
          #
          # o2-events (Secret) — 이벤트 SDK가 user_key를 HMAC으로 바꿀 때 쓰는
          #                       salt. 세 서비스가 같은 값을 봐야 같은 사용자로
          #                       조인된다. infra/04-platform 의 app_events.tf.
          #
          # 셋 다 없는 상태로 배포하면 파드는 뜨지만 config.py의 기본값
          # (localhost:3306)을 보고 DB 연결에서만 실패한다.
          envFrom:
            - configMapRef:
                name: o2-data
            - secretRef:
                name: o2-db
            - secretRef:
                name: o2-events
          # 이벤트 SDK와 Datadog이 읽는 값. 위 ConfigMap과 달리 서비스마다
          # 달라지는 상수라 여기 직접 적는다.
          #
          # 버전은 Pod 템플릿의 라벨에서 가져온다. 두 곳에 SHA를 복사하면
          # 한쪽만 갱신된 상태가 생길 수 있고, 그러면 이벤트는 v1이라 하고
          # Datadog은 v2라 하는 상태가 되어 배포 장애 감별이 무너진다.
          env:
            - name: O2_SERVICE
              value: api
            - name: DD_SERVICE
              value: api
            - name: DD_ENV
              value: dev
            - name: O2_SERVICE_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            - name: DD_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            # 트레이스를 보낼 곳. Datadog 에이전트는 DaemonSet이라 파드와 같은
            # 노드에 있고, hostPort 8126으로 받는다. 서비스 이름으로 부르면
            # 다른 노드의 에이전트에 갈 수 있어 트레이스와 노드 지표가 어긋난다.
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: O2_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DD_ENTITY_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            # Kubernetes는 앞에서 선언한 env 값을 $(VAR)로 치환한다.
            - name: DD_TAGS
              value: "pod_name:$(O2_POD_NAME)"
            # 레거시 읽기 경로 보호 조치(/api/admin/read-path-degraded) 인증 키.
            # Secret은 여기서
            # 안 만든다 — kubectl로 미리 넣어둔 값을 이름으로만 참조한다.
            # 값 자체는 git에 올리지 않는다.
            - name: READ_PATH_DEGRADED_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: api-admin
                  key: READ_PATH_DEGRADED_ADMIN_KEY
            # S3 목업 결제 PG 주입·해제(/api/admin/pg-stub) 전용 키. 기존
            # 관리자 키를 재사용하지 않아 유출 반경을 분리한다. 아직 값을 넣지
            # 않은 환경도 api 배포 자체는 계속 가능해야 하므로 key만 optional로
            # 두며, 애플리케이션은 빈 설정일 때 해당 경로를 전부 403으로 막는다.
            - name: PG_STUB_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: api-admin
                  key: PG_STUB_ADMIN_KEY
                  optional: true
            # cue-warmer(O2-live-ai-ops docs/decisions.md D-041) 전용 경로
            # (/api/internal/warm/{broadcast_id}) 인증 키. 같은 api-admin
            # Secret의 다른 키를 쓴다 — 이 키가 새면 캐시 워밍만 뚫리고,
            # 위 키가 새면 S3 조치 노브가 같이 뚫린다. cue-warmer-deployment.yaml
            # 이 같은 값을 보내는 쪽이다.
            - name: CUE_WARMER_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: api-admin
                  key: CUE_WARMER_ADMIN_KEY
          # FastAPI/uvicorn은 JVM과 달리 뜨는 데 시간이 안 걸린다.
          # startupProbe 없이도 liveness가 먼저 실패할 일이 없다.
          #
          # readiness와 liveness가 보는 것이 다르다.
          #   readyz  MySQL·Valkey 연결까지 — 의존성이 끊기면 트래픽을 받지 않는다
          #   health  프로세스 생존만 — 여기서 의존성을 보면 DB 순단에
          #           전 파드가 재시작 루프에 빠진다
          readinessProbe:
            httpGet: {path: /api/readyz, port: http}
            periodSeconds: 10
            # 기본값 1초로는 부족하다. readyz의 MySQL·Valkey 연결 타임아웃이
            # 각각 2초라, 의존성이 느려지면 응답이 오기 전에 프로브가 먼저
            # 끊어 파드가 NotReady로 빠진다.
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 640Mi # CPU limit은 일부러 걸지 않는다 — 스로틀링이 지연을 만든다
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # Dockerfile의 USER와 같은 값이어야 한다.
            # 비워두고 이미지에서 이름으로만 USER를 지정하면 kubelet이
            # root 여부를 검증하지 못해 CreateContainerConfigError 로 죽는다.
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # readOnlyRootFilesystem을 켰으니 쓸 수 있는 임시 공간을 따로 준다.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
