apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 정적 설계 검토용 overlay다. 로컬 Git이 Argo가 배포한 revision보다 뒤처질 수
# 있으므로 실제 S2 주입은 이 파일을 직접 apply하지 않고, 클러스터의 현재 main을
# 원본으로 쓰는 O2-live-ai-ops/loadtest/s2-canary.sh로만 수행한다.
resources:
  - ../../api-deployment.yaml

nameSuffix: -canary

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      # patch는 nameSuffix transformer보다 먼저 적용되므로 base 이름을 고른다.
      name: api
    patch: |-
      - op: replace
        path: /metadata/labels/app.kubernetes.io~1name
        value: api-canary
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/selector/matchLabels/app.kubernetes.io~1name
        value: api-canary
      - op: replace
        path: /spec/template/metadata/labels/app.kubernetes.io~1name
        value: api-canary
      # main api끼리의 DoNotSchedule 제약은 canary 하나에는 필요 없다.
      # part-of=o2 분산 제약은 남겨 노드 한쪽으로 몰리는 정도만 완화한다.
      - op: remove
        path: /spec/template/spec/topologySpreadConstraints/1
