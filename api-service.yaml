apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: o2-dev
  labels:
    app.kubernetes.io/name: api
spec:
  # ClusterIP로 둔다. 외부 노출은 AWS Load Balancer Controller를 통해
  # Ingress로 붙이는 것이 맞다 — 서비스마다 LoadBalancer 타입을 쓰면
  # 서비스 수만큼 NLB가 생겨 비용이 그대로 늘어난다.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http
