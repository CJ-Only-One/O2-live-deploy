apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-worker
  namespace: o2-dev
  labels:
    app.kubernetes.io/name: order-worker
spec:
  # 큐 깊이에 따라 늘리는 것이 설계지만(KEDA), 임계값을 정하려면 파드 하나가
  # 초당 몇 건을 처리하는지 먼저 재야 한다. 그 측정 전에는 숫자가 추측이므로
  # 1개로 시작한다. KEDA 를 붙일 때는 이 replicas 필드를 제거해야 한다 —
  # 남겨두면 Argo 의 selfHeal 이 계속 1로 되돌린다.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-worker
        app.kubernetes.io/part-of: o2
        # 이미지 태그와 같은 커밋 SHA. app.yml의 deploy 잡이 함께 갱신한다.
        # Pod 템플릿에만 둔다 — selector.matchLabels는 생성 후 불변이다.
        app.kubernetes.io/version: edd1de0acab35fe0941df8d2c5e8cf5bd8980cf2
    spec:
      # 노드그룹이 교체되면 파드가 한꺼번에 Pending 이 됐다가 배치된다. 그때 먼저
      # Ready 된 노드로 전부 쏠리고, 쿠버네티스는 나중에 뜬 노드로 **재분배하지
      # 않는다.** 2026-08-21 에 그 쏠림으로 노드 하나가 메모리 94% 가 되어
      # Datadog DaemonSet 이 Pending 으로 남았다 (measurements.md M-010).
      #
      # `app.kubernetes.io/name` 이 아니라 `part-of` 로 묶는 이유는, 서비스마다
      # 따로 흩으면 replicas 1 짜리 넷이 같은 노드에 몰려도 각자 제약을 만족해
      # 아무것도 막지 못하기 때문이다. o2-dev 파드 전체를 한 덩어리로 본다.
      #
      # DoNotSchedule 이어도 노드가 하나만 남으면 도메인이 하나라 skew 가 0 이라
      # 스케줄을 막지 않는다. 이미 떠 있는 파드를 옮기지는 않으므로, 노드를
      # 추가한 뒤에는 `kubectl rollout restart deploy -n o2-dev` 가 필요하다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/part-of: o2
      # SQS 접근 자격증명이 이 ServiceAccount의 EKS Pod Identity로 들어온다.
      # 이름이 infra/04-platform 의 app_service_accounts 와 어긋나면 파드는
      # 정상적으로 뜨고 SQS 호출에서만 실패한다.
      serviceAccountName: order-worker
      # SIGTERM을 받으면 새 메시지를 받지 않고 처리 중인 배치만 끝낸다.
      # 롱 폴링이 최대 20초라 그보다 넉넉해야 중간에 잘리지 않는다.
      terminationGracePeriodSeconds: 60
      containers:
        - name: order-worker
          image: 066107819912.dkr.ecr.ap-northeast-2.amazonaws.com/o2/order-worker:edd1de0acab35fe0941df8d2c5e8cf5bd8980cf2
          # HTTP를 받지 않는다. Service도 Ingress도 없고 포트도 열지 않는다.
          #
          # 접속 정보는 여기 적지 않는다. api와 같은 ConfigMap·Secret을 쓴다 —
          # 워커도 같은 MySQL과 같은 큐를 본다.
          envFrom:
            - configMapRef:
                name: o2-data
            - secretRef:
                name: o2-db
            # 이벤트 SDK의 user_key HMAC salt. api와 같은 값이어야 조인된다.
            - secretRef:
                name: o2-events
          env:
            - name: O2_SERVICE
              value: order-worker
            - name: DD_SERVICE
              value: order-worker
            - name: DD_ENV
              value: dev
            - name: O2_SERVICE_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            - name: DD_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            # 같은 노드의 에이전트에 보낸다 (api-deployment.yaml 참고).
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          # 프로브를 걸지 않는다. HTTP 엔드포인트가 없고, 큐가 비어 있는 동안
          # 롱 폴링으로 대기하는 것이 정상 상태다. 프로세스가 죽으면 kubelet이
          # 재시작한다.
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi # CPU limit은 걸지 않는다 — 스로틀링이 처리량을 깎는다
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # Dockerfile의 USER와 같은 값이어야 한다. 이름으로만 지정하면
            # kubelet이 root 여부를 검증하지 못해 CreateContainerConfigError로 죽는다.
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # readOnlyRootFilesystem을 켰으니 쓸 수 있는 임시 공간을 따로 준다.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
