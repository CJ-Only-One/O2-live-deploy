apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: o2-dev
  labels:
    app.kubernetes.io/name: frontend
spec:
  # ClusterIP 그대로 둔다. 외부 노출은 Ingress가 맡는다 —
  # LoadBalancer 타입을 쓰면 서비스 수만큼 NLB가 생겨 비용이 그대로 늘어난다.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
