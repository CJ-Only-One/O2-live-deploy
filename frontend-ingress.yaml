apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: o2-dev
  labels:
    app.kubernetes.io/name: frontend
  annotations:
    # 인터넷에서 접근하는 ALB. 퍼블릭 서브넷은 kubernetes.io/role/elb 태그로
    # 컨트롤러가 스스로 찾는다 (01-network 에서 붙였다).
    alb.ingress.kubernetes.io/scheme: internet-facing
    # instance 모드는 NodePort를 거쳐 한 홉 더 간다. VPC CNI가 파드에
    # VPC IP를 주므로 ALB가 파드로 바로 보낼 수 있다.
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    # 파드가 사라진 뒤에도 ALB가 잠시 보내면 502가 난다.
    # 드레이닝을 짧게 잡아 롤링 배포 중 끊김을 줄인다.
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=15
    # WebSocket 때문에 올린다. 클라이언트 하트비트가 30초인데 기본값이 60초라,
    # ping 한 번만 놓쳐도 ALB가 커넥션을 끊는다. 주기의 네 배로 둔다
    # (contracts.md 3.5).
    #
    # 이 값은 ALB 단위라 /api·/ 경로에도 함께 적용된다. HTTP 요청은 그보다
    # 훨씬 짧게 끝나므로 영향이 없다.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=120
spec:
  ingressClassName: alb
  rules:
    # 호스트를 지정하지 않는다 — 도메인이 아직 없어 ALB의 DNS 이름으로 접근한다.
    - http:
        paths:
          # /api는 api 서비스로. ALB는 nginx처럼 경로를 벗겨내지 않고 그대로
          # 넘기므로(prefix rewrite 없음), api 쪽 라우터도 /api 접두사로
          # 맞춰뒀다 (apps/api/app/main.py).
          #
          # 더 구체적인 경로를 먼저 둔다 — /를 먼저 두면 전부 거기로 빠진다.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          # WebSocket. ALB는 Upgrade 헤더를 그대로 넘기므로 별도 애노테이션이
          # 필요 없다.
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: chat-gateway
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
