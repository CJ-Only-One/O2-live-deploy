apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-gateway
  namespace: o2-dev
  labels:
    app.kubernetes.io/name: chat-gateway
spec:
  # 계약이 replica 2개를 요구한다. 한 개면 Pub/Sub 팬아웃이 실제로 파드를
  # 건너가는지 검증할 수 없고, 스케일다운 시 재연결 동작도 시험할 수 없다.
  # HPA를 붙일 때는 이 필드를 제거해야 한다 — selfHeal이 계속 되돌린다.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chat-gateway
  template:
    metadata:
      annotations:
        # Karpenter 가 이 파드를 옮기지 못하게 한다. 노드를 통합·만료로 정리할 때
        # 파드를 다른 노드로 옮기는데, chat-gateway 가 옮겨지면 그 파드가 들고
        # 있던 WebSocket 연결이 전부 끊긴다. 4,000명이 동시에 재연결하면 그것이
        # 곧 장애다 (architecture.md 9.3).
        #
        # NodePool 쪽에서도 consolidationPolicy: WhenEmpty 와 expireAfter: Never 로
        # 막아 두었다. 이건 그 설정이 바뀌거나 다른 NodePool 이 생겼을 때를 위한
        # 이중 방어다 — 파드 자신이 들고 있으므로 노드 설정과 무관하게 유지된다.
        #
        # 비우려면 사람이 창을 잡고 `kubectl drain` 한다. graceful shutdown 이
        # close frame 을 보내고 15초 기다리므로(9.4-2) 피해가 최소화된다.
        karpenter.sh/do-not-disrupt: "true"
      labels:
        app.kubernetes.io/name: chat-gateway
        app.kubernetes.io/part-of: o2
        # 이미지 태그와 같은 커밋 SHA. app.yml의 deploy 잡이 함께 갱신한다.
        # Pod 템플릿에만 둔다 — selector.matchLabels는 생성 후 불변이다.
        app.kubernetes.io/version: 0f0b539e6296a1064bf05c712a76e3bf6ea70dc1
    spec:
      # 노드그룹이 교체되면 파드가 한꺼번에 Pending 이 됐다가 배치된다. 그때 먼저
      # Ready 된 노드로 전부 쏠리고, 쿠버네티스는 나중에 뜬 노드로 **재분배하지
      # 않는다.** 2026-08-21 에 그 쏠림으로 노드 하나가 메모리 94% 가 되어
      # Datadog DaemonSet 이 Pending 으로 남았다 (measurements.md M-010).
      #
      # `app.kubernetes.io/name` 이 아니라 `part-of` 로 묶는 이유는, 서비스마다
      # 따로 흩으면 replicas 1 짜리 넷이 같은 노드에 몰려도 각자 제약을 만족해
      # 아무것도 막지 못하기 때문이다. o2-dev 파드 전체를 한 덩어리로 본다.
      #
      # DoNotSchedule 이어도 노드가 하나만 남으면 도메인이 하나라 skew 가 0 이라
      # 스케줄을 막지 않는다. 이미 떠 있는 파드를 옮기지는 않으므로, 노드를
      # 추가한 뒤에는 `kubectl rollout restart deploy -n o2-dev` 가 필요하다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/part-of: o2
        # 위 제약은 o2-dev 파드 **전체**를 3/3 으로 가를 뿐이라, 그 안에서
        # 같은 서비스의 두 파드가 한 노드에 붙어도 조건을 만족한다. 실제로
        # 2026-08-21 머지 직후 chat-gateway 2개가 같은 노드에 몰렸다.
        #
        # replicas 2 를 두는 이유가 노드 장애를 견디는 것이므로 그러면 의미가
        # 없다. 부하 측정에서도 두 파드가 같은 2 vCPU 를 나눠 쓰면 파드당
        # 계수가 오염된다 (measurements.md M-010). 자기 서비스 기준을 하나 더
        # 건다 — 두 제약은 AND 로 걸린다.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: chat-gateway
      serviceAccountName: chat-gateway
      # close frame을 보내고 15초를 기다린 뒤 종료한다. 그보다 넉넉해야
      # 드레이닝이 중간에 잘리지 않는다 (architecture.md 9.4-2).
      terminationGracePeriodSeconds: 60
      containers:
        - name: chat-gateway
          image: 066107819912.dkr.ecr.ap-northeast-2.amazonaws.com/o2/chat-gateway:0f0b539e6296a1064bf05c712a76e3bf6ea70dc1
          ports:
            - name: http
              containerPort: 8080
          # Valkey 주소가 여기서 온다. Pub/Sub 채널이 팬아웃의 전부이므로
          # 이 연결이 끊기면 파드 간 전달이 멈춘다.
          envFrom:
            - configMapRef:
                name: o2-data
            # user_key HMAC salt. 발행 스위치(EMIT_CHAT_EVENTS)와 무관하게
            # 필요하다 — 접속 시점에 이미 해싱한다 (events.ts hashUserKey).
            # 값이 api와 다르면 같은 사용자가 다른 키로 갈린다.
            - secretRef:
                name: o2-events
          env:
            - name: O2_SERVICE
              value: chat-gateway
            - name: DD_SERVICE
              value: chat-gateway
            - name: DD_ENV
              value: dev
            - name: O2_SERVICE_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            - name: DD_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            # 같은 노드의 에이전트에 보낸다 (api-deployment.yaml 참고).
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # contracts.md 5.5의 확인이 끝나 켠다. Firehose(o2-business-to-s3)는
            # 동적 파티셔닝도 Lambda 변환도 꺼져 있고 파티션이 시각 기준이라,
            # 모르는 event_name이 들어와도 원본 그대로 적재되고 같은 배치의
            # 다른 이벤트에 영향을 주지 않는다.
            #
            # ConfigMap o2-data에도 같은 키가 있다(04-platform이 넣는다). 여기
            # env가 그것을 덮으므로 **끄려면 이 줄을 고쳐야 한다** — Terraform만
            # 바꾸면 파드 안에서는 안 바뀐다.
            - name: EMIT_CHAT_EVENTS
              value: "true"
            # S1(O2-live-ai-ops docs/scenario-experiment.md 0.5) 조치 실행
            # 라우트(/ws/admin/channel-limit) 인증 키. Secret은 여기서 안
            # 만든다 — kubectl로 미리 넣어둔 값을 이름으로만 참조한다.
            # 값 자체는 git에 올리지 않는다.
            - name: CHANNEL_LIMIT_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: chat-gateway-admin
                  key: CHANNEL_LIMIT_ADMIN_KEY
          # WebSocket 업그레이드가 아니라 일반 HTTP로 답하는 경로다.
          # 의존성(Valkey)을 검사하지 않는다 — 여기서 검사하면 Valkey 순단에
          # 전 파드가 재시작 루프에 빠지고, 그 순간이 재연결 폭풍이다.
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi # CPU limit은 걸지 않는다 — 스로틀링이 팬아웃 지연을 만든다
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # Dockerfile의 USER와 같은 값이어야 한다. node 이미지의 기본
            # node 사용자가 1000번이다.
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
